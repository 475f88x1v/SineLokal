
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
        name="description"
        content="Create a SineLokal account to discover Filipino films and save your favorites."
    >

    <meta name="theme-color" content="#0b0b0b">

    <title>Create Account | SineLokal</title>

    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>

    <script defer src="js/components.js"></script>

    <script defer src="js/auth.js"></script>
</head>

<body data-page="register">

    <div id="navbarComponent"></div>

    <main class="auth-wrap">

        <section class="auth-card" aria-labelledby="registerTitle">

            <div class="auth-heading">
                <p class="eyebrow">JOIN THE COMMUNITY</p>

                <h1 id="registerTitle">
                    Create your account
                </h1>

                <p>
                    Save your favorite films and build your own collection.
                </p>
            </div>

            <form
                id="authForm"
                class="form-stack"
                data-mode="register"
            >

                <label for="displayName">
                    Display name

                    <input
                        class="form-field"
                        id="displayName"
                        name="displayName"
                        type="text"
                        autocomplete="name"
                        required
                        maxlength="80"
                        placeholder="Your name"
                    >
                </label>

                <label for="email">
                    Email address

                    <input
                        class="form-field"
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        placeholder="you@example.com"
                    >
                </label>

                <label for="password">
                    Password

                    <input
                        class="form-field"
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        required
                        minlength="8"
                        placeholder="At least 8 characters"
                    >
                </label>

                <div
                    id="authMessage"
                    class="status-message"
                    aria-live="polite"
                    role="status"
                ></div>

                <button
                    class="button button-gold"
                    type="submit"
                >
                    Create account
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </section>

    </main>

    <div id="footerComponent"></div>

</body>
</html>
