
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
        name="description"
        content="View your saved Filipino films and keep your favorite stories close with SineLokal."
    >

    <meta name="theme-color" content="#0b0b0b">

    <title>My Favorites | SineLokal</title>

    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/disclaimer.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>

    <script src="js/movies.js"></script>

    <script defer src="js/components.js"></script>

    <script defer src="js/disclaimer.js"></script>

    <script defer src="js/app.js"></script>
</head>

<body data-page="favorites">

    <div id="navbarComponent"></div>

    <main class="container">

        <section class="page-hero">
            <p class="eyebrow">YOUR PERSONAL COLLECTION</p>

            <h1>My Favorites</h1>

            <p>
                Keep the Filipino films you love close at hand.
            </p>
        </section>

        <p
            id="favoritesNotice"
            class="role-note"
            style="margin-bottom: 24px;"
            aria-live="polite"
        >
            Loading your favorites…
        </p>

        <section
            class="section favorites-section"
            style="padding-top: 0;"
            aria-label="Your favorite films"
        >
            <div
                class="movie-grid"
                id="favoritesGrid"
                aria-live="polite"
            ></div>
        </section>

    </main>

    <div id="footerComponent"></div>

</body>
</html>
