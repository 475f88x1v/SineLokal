<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Log in | SineLokal</title>
    <meta
        name="description"
        content="Log in to SineLokal to save your favorite Filipino films and discover more stories from Philippine cinema."
    >

    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/disclaimer.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>

    <script defer src="js/components.js"></script>
    <script defer src="js/disclaimer.js"></script>
    <script defer src="js/auth.js"></script>
</head>

<body data-page="login">

    <div id="navbarComponent"></div>

    <main class="auth-wrap">
        <section class="auth-card">
            <p class="eyebrow">WELCOME BACK</p>

            <h1>Log in to SineLokal</h1>

            <p>
                Sign in to save favorites and personalize your film discovery.
            </p>

            <form
                id="authForm"
                class="form-stack"
                data-mode="login"
            >
                <label for="email">
                    Email address

                    <input
                        class="form-field"
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        placeholder="you@example.com"
                    >
                </label>

                <label for="password">
                    Password

                    <input
                        class="form-field"
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        minlength="6"
                        placeholder="Your password"
                    >
                </label>

                <div
                    id="authMessage"
                    class="status-message"
                    aria-live="polite"
                    role="status"
                ></div>

                <button class="button button-gold" type="submit">
                    Log in
                </button>
            </form>

            <p class="auth-switch">
                New to SineLokal?
                <a href="register.html">Create an account</a>
            </p>
        </section>
    </main>

    <div id="footerComponent"></div>

</body>
</html>
